<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-black">
    <div class="container-fluid p-0 m-0">
        <div class="row row-cols-1 row-cols-xl-2 p-0 m-0 g-0">
            <div class="col p-0 m-0">
                <img src="hut-19-budi-arsa.jpg" alt="01" class="img-fluid">
            </div>
            <div class="col p-0 g-0">
                <img src="hut-19-budi-arsa-02.jpg" alt="01" class="img-fluid">
            </div>
        </div>
    </div>

    <div style="height: 20vh;"></div>

    <div class="position-fixed start-50 bottom-0 translate-middle-x my-3 container">
        <div class="card" data-bs-theme="dark">
            <div class="card-body px-5 text-center">
                <div class="d-flex flex-wrap justify-content-center align-items-center gap-3">
                    <span>Silakan konfirmasi kehadiran anda: </span>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                        Konfirmasi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-lg-down">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Formulir Kehadiran</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" data-bs-target="#exampleModal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 m-0">
                    <iframe
                        src="https://docs.google.com/forms/d/e/1FAIpQLScGuz5LCaS7AOP6SwA0tMyWijER_kUDE_e0KqtR5HwRj8F7ww/viewform?embedded=true"
                        frameborder="0" marginheight="0" marginwidth="0"
                        style="width: 100%; min-height: 100vh;">Memuat…</iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const duration = 3 * 1000; // 3 Detik
            const end = Date.now() + duration;

            (function frame() {
                
                confetti({
                    particleCount: 2,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                
                confetti({
                    particleCount: 2,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>

</html>
